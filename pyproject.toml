[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-ai-lab"
version = "1.1.0"
description = "Quantum algorithms, cryptography, machine learning, chaos, simulation, optimization, RL and vision — from first principles in pure NumPy/SciPy."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "rasidi3112"},
]
keywords = [
    "quantum-computing",
    "quantum-machine-learning",
    "quantum-algorithms",
    "quantum-cryptography",
    "quantum-simulation",
    "quantum-optimization",
    "quantum-reinforcement-learning",
    "quantum-vision",
    "qaoa",
    "vqe",
    "shor",
    "grover",
    "bb84",
    "statevector-simulator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
quantum = [
    "pennylane>=0.33.0",
    "qiskit>=1.0.0",
]
ml = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.10",
]
all = [
    "quantum-ai-lab[quantum,ml,dev]",
]

[project.urls]
Homepage = "https://github.com/rasidi3112/quantum-ai-lab"
Repository = "https://github.com/rasidi3112/quantum-ai-lab"
Documentation = "https://github.com/rasidi3112/quantum-ai-lab/tree/main/docs"
Issues = "https://github.com/rasidi3112/quantum-ai-lab/issues"

[project.scripts]
qailab = "quantum_ai_lab.cli:main"

[tool.setuptools.packages.find]
include = [
    "quantum_ai_lab*",
    "quantum_ml*",
    "quantum_chaos*",
    "quantum_crypto*",
    "quantum_algorithms*",
    "quantum_simulation*",
    "quantum_optimization*",
    "quantum_rl*",
    "quantum_vision*",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "ANN"]
ignore = ["E501", "E741", "B905", "ANN401", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"scripts/**" = ["D", "ANN"]
"**/examples/**" = ["D", "ANN"]

[tool.mypy]
python_version = "3.10"
files = [
    "quantum_ai_lab",
    "quantum_algorithms",
    "quantum_chaos",
    "quantum_crypto",
    "quantum_ml",
    "quantum_optimization",
    "quantum_rl",
    "quantum_simulation",
    "quantum_vision",
]
exclude = ["/examples/", "ular\\.py$"]
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true

[tool.coverage.run]
source = [
    "quantum_ai_lab",
    "quantum_algorithms",
    "quantum_chaos",
    "quantum_crypto",
    "quantum_ml",
    "quantum_optimization",
    "quantum_rl",
    "quantum_simulation",
    "quantum_vision",
]
omit = ["*/examples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short"
